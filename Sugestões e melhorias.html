<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugestões e melhorias</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2233;--mu:#5d667a;--bd:#d9deea;--ac:#2f5bea;--ac2:#fff;--ok:#127a4b;--er:#c0262d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#e8ecf6;--mu:#98a2b8;--bd:#2b3348;--ac:#6f8dff;--ac2:#0d1226;--ok:#4cc38a;--er:#ff7a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2030;--tx:#e8ecf6;--mu:#98a2b8;--bd:#2b3348;--ac:#6f8dff;--ac2:#0d1226;--ok:#4cc38a;--er:#ff7a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
textarea{min-height:160px;resize:vertical}
.hint{font-size:.85rem;color:var(--mu);margin-top:4px}
.err{color:var(--er);font-size:.85rem;margin-top:4px;min-height:1em}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.9rem;color:var(--mu)}
.chk input{width:auto;margin-top:4px}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#1b2233;border:1px solid var(--bd);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.ok{color:var(--ok);font-weight:600}
.item{border-top:1px solid var(--bd);padding:14px 0}
.item:first-child{border-top:0}
.meta{font-size:.85rem;color:var(--mu)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.8rem;margin-left:6px}
.msg{white-space:pre-wrap;margin:6px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Sugestões e melhorias</h1>
  <p class="sub">Conte-nos o que aconteceu sobre o atendimento ou qualquer outro ponto do curso. Entraremos em contato.</p>

  <section class="card" id="formCard">
    <div id="formBox">
      <label for="nome">Nome completo</label>
      <input id="nome" autocomplete="name" placeholder="Digite seu nome completo">
      <div class="err" id="eNome"></div>

      <label for="cpf">CPF</label>
      <input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
      <div class="err" id="eCpf"></div>

      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com">
      <div class="err" id="eEmail"></div>

      <label for="tipo">Assunto</label>
      <select id="tipo">
        <option>Atendimento</option>
        <option>Conteúdo / aulas</option>
        <option>Professores / instrutores</option>
        <option>Plataforma / acesso</option>
        <option>Financeiro / pagamentos</option>
        <option>Outros</option>
      </select>

      <label for="texto">Descrição</label>
      <textarea id="texto" placeholder="Descreva sua sugestão ou melhoria com o máximo de detalhes possível."></textarea>
      <div class="err" id="eTexto"></div>

      <div class="chk">
        <input type="checkbox" id="lgpd">
        <label for="lgpd" style="font-weight:400;margin:0">Autorizo o uso do meu nome, CPF e e-mail apenas para identificar esta reclamação e entrar em contato comigo.</label>
      </div>
      <div class="err" id="eLgpd"></div>

      <button id="enviar">Enviar reclamação</button>
      <div class="err" id="eGeral" style="text-align:center;margin-top:10px"></div>
    </div>
    <div id="done" hidden>
      <p class="ok">✔ Reclamação enviada com sucesso!</p>
      <p>Obrigado por nos avisar. Guarde seu protocolo: <strong id="proto"></strong></p>
      <button id="nova">Enviar outra reclamação</button>
    </div>
  </section>

  <section class="card" id="adm" hidden>
    <h2 style="margin:0 0 10px;font-size:1.15rem">Painel de reclamações <span class="meta" id="cont"></span></h2>
    <label for="busca" style="margin-top:0">Pesquisar</label>
    <input id="busca" type="search" placeholder="Buscar por nome, CPF ou e-mail">
    <div id="lista" style="margin-top:8px"><p class="meta">Carregando...</p></div>
  </section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var db=null, user=null;

  function soDig(s){return s.replace(/\D/g,"")}
  function mask(v){
    v=soDig(v).slice(0,11);
    return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  }
  function cpfOk(c){
    c=soDig(c);
    if(c.length!==11||/^(\d)\1+$/.test(c))return false;
    for(var t=9;t<11;t++){
      var s=0;
      for(var i=0;i<t;i++)s+=c[i]*(t+1-i);
      var d=(s*10)%11%10;
      if(d!=c[t])return false;
    }
    return true;
  }
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

  $("cpf").addEventListener("input",function(){this.value=mask(this.value)});

  function limpar(){["eNome","eCpf","eEmail","eTexto","eLgpd","eGeral"].forEach(function(i){$(i).textContent=""})}

  $("enviar").addEventListener("click",async function(){
    limpar();
    var nome=$("nome").value.trim().replace(/\s+/g," "),cpf=$("cpf").value,texto=$("texto").value.trim(),ok=true;
    if(nome.split(" ").length<2||nome.length<5){$("eNome").textContent="Informe seu nome completo.";ok=false}
    if(!cpfOk(cpf)){$("eCpf").textContent="CPF inválido. Confira os números.";ok=false}
    var email=$("email").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){$("eEmail").textContent="Informe um e-mail válido.";ok=false}
    if(texto.length<20){$("eTexto").textContent="Descreva sua reclamação (mínimo de 20 caracteres).";ok=false}
    if(!$("lgpd").checked){$("eLgpd").textContent="É necessário autorizar o uso dos dados.";ok=false}
    if(!ok)return;
    if(!db){$("eGeral").textContent="Não foi possível conectar ao sistema agora. Tente novamente em instantes.";return}
    var btn=this;btn.disabled=true;btn.textContent="Enviando...";
    var proto="REC-"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
    try{
      var uid=await user.id();
      var ref=db.collection("complaints").doc(uid);
      var snap=await ref.get();
      var itens=(snap.exists&&snap.data().items)||[];
      itens.push({protocolo:proto,nome:nome,cpf:cpf,email:email,assunto:$("tipo").value,texto:texto,criadoEm:new Date().toISOString()});
      await ref.set({items:itens});
      $("proto").textContent=proto;
      $("formBox").hidden=true;$("done").hidden=false;
    }catch(e){
      $("eGeral").textContent="Erro ao enviar. Verifique sua conexão e tente novamente.";
    }
    btn.disabled=false;btn.textContent="Enviar reclamação";
  });

  $("nova").addEventListener("click",function(){
    ["nome","cpf","email","texto"].forEach(function(i){$(i).value=""});
    $("lgpd").checked=false;
    $("done").hidden=true;$("formBox").hidden=false;
  });

  // Painel (somente quem pode editar a página)
  var todas=[];
  function render(){
    var q=$("busca").value.trim().toLowerCase(),qd=soDig(q);
    var l=todas.filter(function(r){
      return !q||r.nome.toLowerCase().indexOf(q)>-1||(qd&&soDig(r.cpf).indexOf(qd)>-1)||r.protocolo.toLowerCase().indexOf(q)>-1||(r.email||"").toLowerCase().indexOf(q)>-1;
    });
    $("cont").textContent="("+l.length+" de "+todas.length+")";
    $("lista").innerHTML=l.length?l.map(function(r){
      var d=new Date(r.criadoEm).toLocaleString("pt-BR");
      return '<div class="item"><strong>'+esc(r.nome)+'</strong><span class="tag">'+esc(r.assunto)+'</span>'+
        '<div class="meta">CPF '+esc(r.cpf)+' · '+esc(r.email||"sem e-mail")+' · '+esc(d)+' · '+esc(r.protocolo)+'</div>'+
        '<p class="msg">'+esc(r.texto)+'</p></div>';
    }).join(""):'<p class="meta">Nenhuma reclamação encontrada.</p>';
  }
  $("busca").addEventListener("input",render);

  async function init(){
    try{
      if(!window.claude)return;
      db=await claude.use("db");
      user=await claude.use("user");
      if(db&&user&&(user.canEdit()||user.isOwner())){
        $("adm").hidden=false;
        db.collection("complaints").onSnapshot(function(s){
          todas=[].concat.apply([],s.docs.map(function(d){return d.data().items||[]}))
            .sort(function(a,b){return a.criadoEm<b.criadoEm?1:-1});render();
        },function(){$("lista").innerHTML='<p class="meta">Não foi possível carregar as reclamações.</p>';});
      }
    }catch(e){}
  }
  init();
})();
</script>
</body>
</html>
