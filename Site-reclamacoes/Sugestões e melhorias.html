<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugestões e melhorias</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2233;--mu:#5d667a;--bd:#d9deea;--ac:#2f5bea;--ok:#127a4b;--er:#c0262d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#e8ecf6;--mu:#98a2b8;--bd:#2b3348;--ac:#6f8dff;--ok:#4cc38a;--er:#ff7a80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}h1{font-size:1.6rem;margin:8px 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}textarea{min-height:160px;resize:vertical}
.hint,.meta{font-size:.85rem;color:var(--mu)}.err{color:var(--er);font-size:.85rem;margin-top:4px;min-height:1em}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.9rem;color:var(--mu)}.chk input{width:auto;margin-top:4px}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:white;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:not-allowed}
.ok{color:var(--ok);font-weight:600}.item{border-top:1px solid var(--bd);padding:14px 0}.item:first-child{border-top:0}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.8rem;margin-left:6px}
.msg{white-space:pre-wrap;margin:6px 0 0}[hidden]{display:none!important}.admin-actions{display:flex;gap:10px;align-items:center}.admin-actions button{width:auto;flex:1}
</style>
<script src="../assets/vendor/cpf-1.0.2.min.js"></script>
<script src="../assets/captcha-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Sugestões e melhorias</h1>
  <p class="sub">Conte-nos o que aconteceu sobre o atendimento ou qualquer outro ponto do curso. Entraremos em contato.</p>
  <section class="card" id="formCard">
    <div id="formBox">
      <label for="nome">Nome completo</label><input id="nome" autocomplete="name" maxlength="120" placeholder="Digite seu nome completo"><div class="err" id="eNome"></div>
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="seuemail@exemplo.com"><div class="err" id="eEmail"></div>
      <label for="cpf">CPF <span class="meta">(opcional)</span></label><input id="cpf" type="text" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" aria-describedby="eCpf"><div class="err" id="eCpf" aria-live="polite"></div>
      <label for="telefone">Telefone <span class="meta">(opcional)</span></label><input id="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(00) 00000-0000">
      <label for="tipo">Assunto</label><select id="tipo"><option>Atendimento</option><option>Conteúdo / aulas</option><option>Professores / instrutores</option><option>Plataforma / acesso</option><option>Financeiro / pagamentos</option><option>Outros</option></select>
      <label for="texto">Descrição</label><textarea id="texto" maxlength="5000" placeholder="Descreva sua sugestão ou melhoria com o máximo de detalhes possível."></textarea><div class="err" id="eTexto"></div>
      <div class="chk"><input type="checkbox" id="lgpd"><label for="lgpd" style="font-weight:400;margin:0">Autorizo o uso dos dados informados neste formulário para identificar e tratar esta manifestação e, se necessário, entrar em contato comigo. CPF e telefone são opcionais.</label></div><div class="err" id="eLgpd"></div>
      <div id="captcha" style="margin-top:16px"></div><div class="err" id="eCaptcha" aria-live="polite"></div>
      <button id="enviar">Enviar reclamação</button><div class="err" id="eGeral" style="text-align:center;margin-top:10px"></div>
    </div>
    <div id="done" hidden><p class="ok">✔ Reclamação enviada com sucesso!</p><p>Obrigado por nos avisar. Guarde seu protocolo: <strong id="proto"></strong></p><button class="secondary" id="nova">Enviar outra reclamação</button></div>
  </section>

  <p class="hint" style="text-align:center">As informações enviadas são utilizadas somente para tratar esta manifestação.</p>
</main>
<script>
(function(){
  "use strict";
  // Preencha estes dois campos com os dados públicos do seu projeto Supabase.
  // Nunca coloque aqui a chave service_role ou qualquer senha administrativa.
  var SUPABASE_URL = "https://ybucnycqdantdggvbvpj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_Fc3wpHgR97igffUgSK7u0Q_YM6WUihH";
  var $=function(id){return document.getElementById(id)};
  var client=null;
  function erro(id,msg){$(id).textContent=msg||""}
  function configurar(){
    if(!window.supabase||SUPABASE_URL.indexOf("https://")!==0||SUPABASE_ANON_KEY.indexOf("COLE_")===0)return false;
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    return true;
  }
  function protocolo(){return "REC-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}
  function validarCPF(v){return !!window.CPF && window.CPF.isValid(v, true)}
  function mascaraCPF(v){
    return v.replace(/\D/g,"").slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  }
  $("cpf").addEventListener("input",function(){
    var pos=this.selectionStart, digits=this.value.slice(0,pos).replace(/\D/g,"").length;
    this.value=mascaraCPF(this.value);
    var caret=0,count=0;
    while(caret<this.value.length&&count<digits){if(/\d/.test(this.value[caret]))count++;caret++}
    this.setSelectionRange(caret,caret);
    erro("eCpf","");this.removeAttribute("aria-invalid");
  });
  var captchaConfig=window.CENTRAL_CAPTCHA||{}, captchaToken="", captchaWidget=null;
  var captchaEnabled=!!(captchaConfig.enabled&&captchaConfig.siteKey);
  function resetCaptcha(){
    captchaToken="";
    if(window.turnstile&&captchaWidget!==null)window.turnstile.reset(captchaWidget);
  }
  window.centralCaptchaReady=function(){
    captchaWidget=window.turnstile.render("#captcha",{
      sitekey:captchaConfig.siteKey,action:"submit-complaint",language:"pt-br",
      callback:function(token){captchaToken=token;erro("eCaptcha","")},
      "expired-callback":function(){captchaToken="";erro("eCaptcha","A verificação expirou. Faça novamente.")},
      "error-callback":function(){captchaToken="";erro("eCaptcha","Não foi possível verificar. Recarregue a página.")}
    });
  };
  if(captchaEnabled){
    var script=document.createElement("script");
    script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=centralCaptchaReady&render=explicit";
    script.async=true;script.defer=true;
    script.onerror=function(){erro("eCaptcha","Não foi possível carregar a verificação. Recarregue a página.")};
    document.head.appendChild(script);
  }
  async function enviarManifestacao(row){
    if(!captchaEnabled){
      // Compatibilidade temporária durante a ativação. Remover após a migração CAPTCHA.
      var legacy=await client.from("complaints").insert(row);
      if(legacy.error)throw legacy.error;
      return row.protocolo;
    }
    var response=await fetch(SUPABASE_URL+"/functions/v1/submit-complaint",{
      method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},
      body:JSON.stringify({nome:row.nome,email:row.email,cpf:row.cpf,telefone:row.telefone,assunto:row.assunto,texto:row.texto,consentimento:true,captchaToken:captchaToken})
    });
    var data=await response.json();
    if(!response.ok||!data.protocolo){
      var failure=new Error("Falha ao enviar");failure.status=response.status;throw failure;
    }
    return data.protocolo;
  }
  var ultimoProtocolo="";
  var old=$("enviar");
  old.addEventListener("click",async function(){
    ["eNome","eCpf","eEmail","eTexto","eLgpd","eGeral","eCaptcha"].forEach(function(id){erro(id,"")});
    var nome=$("nome").value.trim().replace(/\s+/g," "),email=$("email").value.trim(),cpf=$("cpf").value.replace(/\D/g,""),telefone=$("telefone").value.replace(/\D/g,""),texto=$("texto").value.trim(),ok=true;
    if(nome.length<5||nome.split(" ").length<2){erro("eNome","Informe seu nome completo.");ok=false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){erro("eEmail","Informe um e-mail válido.");ok=false}
    if(cpf&&!validarCPF(cpf)){erro("eCpf",window.CPF?"O CPF informado não é válido. Confira os números.":"Não foi possível carregar a validação de CPF. Recarregue a página.");$("cpf").setAttribute("aria-invalid","true");ok=false}
    if(telefone&&telefone.length!==10&&telefone.length!==11){erro("eGeral","Informe um telefone com DDD válido ou deixe o campo em branco.");ok=false}
    if(texto.length<20){erro("eTexto","Descreva sua manifestação (mínimo de 20 caracteres).");ok=false}
    if(!$("lgpd").checked){erro("eLgpd","É necessário autorizar o uso dos dados.");ok=false}
    if(captchaEnabled&&!captchaToken){erro("eCaptcha","Conclua a verificação de segurança antes de enviar.");ok=false}
    if(!ok)return;
    if(!client){erro("eGeral","O sistema ainda está sendo configurado. Tente novamente mais tarde.");return}
    old.disabled=true;old.textContent="Enviando...";ultimoProtocolo=protocolo();
    try{
      ultimoProtocolo=await enviarManifestacao({protocolo:ultimoProtocolo,nome:nome,email:email,cpf:cpf||null,telefone:telefone||null,assunto:$("tipo").value,texto:texto});
      $("proto").textContent=ultimoProtocolo;$("formBox").hidden=true;$("done").hidden=false;
    }catch(e){erro("eGeral",e.status===429?"Você enviou várias manifestações em pouco tempo. Aguarde alguns minutos.":e.status===403?"A verificação de segurança falhou. Faça novamente.":"Não foi possível enviar. Verifique sua conexão e tente novamente.")}
    if(captchaEnabled)resetCaptcha();
    old.disabled=false;old.textContent="Enviar reclamação";
  });
  $("nova").addEventListener("click",function(){
    ["nome","email","cpf","telefone","texto"].forEach(function(id){$(id).value=""});$("lgpd").checked=false;
    $("done").hidden=true;$("formBox").hidden=false;
  });
  configurar();
})();
</script>
</body></html>
